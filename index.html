    <style>
      :root {
        --bg: #08090c;
        --accent: #2dd4bf;
        --accent-strong: #14b8a6;
        --border: rgba(255, 255, 255, 0.08);
        --border-hover: rgba(45, 212, 191, 0.35);
      }

      * { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

      html { scroll-behavior: smooth; }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      }

      body {
        font-family: 'Inter', system-ui, sans-serif;
        background-color: var(--bg);
      }
      h1, h2, h3, h4, h5, h6 { font-family: 'Space Grotesk', sans-serif; }
      code, pre, .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }

      .font-display { letter-spacing: -0.02em; }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 10px; }
      ::-webkit-scrollbar-track { background: var(--bg); }
      ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 6px; border: 2px solid var(--bg); }
      ::-webkit-scrollbar-thumb:hover { background: rgba(45, 212, 191, 0.5); }
      ::selection { background: rgba(45, 212, 191, 0.25); color: #fff; }

      /* Surfaces */
      .glass {
        background: rgba(255, 255, 255, 0.015);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border);
      }
      .card {
        position: relative;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.028), rgba(255, 255, 255, 0.008));
        border: 1px solid var(--border);
        border-radius: 18px;
        transition: border-color 0.4s ease, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s ease;
      }
      .card:hover {
        border-color: var(--border-hover);
        transform: translateY(-4px);
        box-shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.9);
      }

      /* Pointer-tracked spotlight */
      .spot::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(360px circle at var(--mx, 50%) var(--my, -30%), rgba(45, 212, 191, 0.10), transparent 62%);
        opacity: 0;
        transition: opacity 0.45s ease;
        pointer-events: none;
        z-index: 0;
      }
      .spot:hover::before { opacity: 1; }

      /* Backgrounds */
      .grid-fade {
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 68px 68px;
        -webkit-mask-image: radial-gradient(ellipse 75% 55% at 50% 0%, #000 30%, transparent 100%);
        mask-image: radial-gradient(ellipse 75% 55% at 50% 0%, #000 30%, transparent 100%);
      }

      .gradient-text {
        background: linear-gradient(120deg, #5eead4 0%, #2dd4bf 45%, #0d9488 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

      /* Scroll reveal */
      .reveal { opacity: 0; transform: translateY(26px); transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), transform 0.7s cubic-bezier(0.22, 1, 0.36, 1); }
      .reveal.visible { opacity: 1; transform: translateY(0); }

      /* Marquee mask */
      .marquee-mask { -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }

      /* Film grain */
      .noise-overlay::before {
        content: '';
        position: fixed;
        inset: 0;
        opacity: 0.02;
        z-index: 100;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }
    </style>
