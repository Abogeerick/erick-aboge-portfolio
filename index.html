<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Portfolio of Erick Aboge — Full-Cycle Software Engineer. Building software from architecture to production. End-to-end ownership of enterprise systems." />
    <meta name="keywords" content="Erick Aboge, Full-Cycle Software Engineer, React, Node.js, AWS, Django, TypeScript, Portfolio" />

    <!-- Open Graph -->
    <meta property="og:title" content="Erick Aboge | Full-Cycle Software Engineer" />

    <meta property="og:type" content="website" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              teal: {
                900: '#05595B',
                800: '#062C30',
                700: '#0a7c7e',
                600: '#0d9488',
              },
              amber: {
                400: '#FFB020',
                300: '#ffc14d',
              },
              slate: {
                950: '#0a0f1a',
                900: '#0f172a',
                850: '#131c31',
              }
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
              mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'float-delayed': 'float 6s ease-in-out 2s infinite',
              'pulse-glow': 'pulse-glow 2s ease-in-out infinite',
              'gradient-shift': 'gradient-shift 8s ease infinite',
              'slide-up': 'slide-up 0.6s ease-out',
              'slide-up-delayed': 'slide-up 0.6s ease-out 0.2s both',
              'fade-in': 'fade-in 0.8s ease-out',
              'typing': 'typing 3.5s steps(40, end), blink-caret .75s step-end infinite',
              'scan-line': 'scan-line 4s linear infinite',
            },
            keyframes: {
              'float': {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              'pulse-glow': {
                '0%, 100%': { opacity: '0.4' },
                '50%': { opacity: '1' },
              },
              'gradient-shift': {
                '0%, 100%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
              },
              'slide-up': {
                '0%': { opacity: '0', transform: 'translateY(30px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'fade-in': {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              'typing': {
                'from': { width: '0' },
                'to': { width: '100%' },
              },
              'blink-caret': {
                'from, to': { borderColor: 'transparent' },
                '50%': { borderColor: '#FFB020' },
              },
              'scan-line': {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(100%)' },
              },
            }
          }
        }
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0f1a; 
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #0d9488, #05595B);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #14b8a6, #0a7c7e);
      }
      
      body {
        font-family: 'Inter', system-ui, sans-serif;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Space Grotesk', sans-serif;
      }
      code, pre, .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
      }

      /* Smooth scroll */
      html {
        scroll-behavior: smooth;
      }

      /* Glass morphism utility */
      .glass {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .glass-light {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(0, 0, 0, 0.08);
      }

      /* Grid pattern */
      .grid-pattern {
        background-image: 
          linear-gradient(rgba(13, 148, 136, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(13, 148, 136, 0.03) 1px, transparent 1px);
        background-size: 60px 60px;
      }

      /* Gradient text */
      .gradient-text {
        background: linear-gradient(135deg, #14b8a6 0%, #0d9488 50%, #FFB020 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Line clamp */
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .line-clamp-3 {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* Animate on scroll */
      .reveal {
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      }
      .reveal.visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* Project card featured glow */
      .featured-glow {
        box-shadow: 0 0 60px -12px rgba(13, 148, 136, 0.3);
      }

      /* Noise overlay */
      .noise-overlay::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.015;
        z-index: 100;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",

}
</script>
